name: CI/CD Pipeline

on:
  push:
    branches: [main, fix/auth-api-lockdown]
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:check-migrations
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:target-guard
      - name: Production verification build before startup assertions
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_APP_URL: https://jobsclick.example.invalid
          API_URL: http://127.0.0.1:1
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Full suite on a per-run Supabase and Redis project
        run: pnpm test

  auth-disposable:
    name: AUTH-01 migration contracts on disposable Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - name: Check runner Docker service
        run: docker info
      - run: pnpm ci:check-migrations
      - run: pnpm --filter @indian-job-portal/database --filter @indian-job-portal/validation run build
      - run: pnpm test:auth-migration

  db-security-gate:
    name: Database security, type freshness and native pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:check-migrations
      - run: pnpm --filter @indian-job-portal/database --filter @indian-job-portal/validation run build
      - name: Preserve type, catalog, attacker and HTTP smoke gates inside one disposable run
        run: pnpm test -- --db-tools --auth-contracts packages/database/test

  auth-native-otp:
    name: Native OTP, admission and CAPTCHA on independent disposable stacks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:check-migrations
      - run: pnpm --filter @indian-job-portal/database --filter @indian-job-portal/validation run build
      - name: Real GoTrue phone OTP with fake delivery
        run: pnpm test -- --native-otp --auth-contracts apps/api/test/supabase-sms-hook.local.spec.ts
      - run: if [ -f docs/auth/evidence/S4-native/observations.json ]; then mv docs/auth/evidence/S4-native/observations.json "$RUNNER_TEMP/phone-native-observations.json"; fi
        if: always()
      - name: Cold-start native OTP trial 2 (every trial required)
        run: pnpm test -- --native-otp --auth-contracts apps/api/test/supabase-sms-hook.local.spec.ts
      - run: if [ -f docs/auth/evidence/S4-native/observations.json ]; then mv docs/auth/evidence/S4-native/observations.json "$RUNNER_TEMP/phone-trial-2-observations.json"; fi
        if: always()
      - name: Cold-start native OTP trial 3 (every trial required)
        run: pnpm test -- --native-otp --auth-contracts apps/api/test/supabase-sms-hook.local.spec.ts
      - run: if [ -f docs/auth/evidence/S4-native/observations.json ]; then mv docs/auth/evidence/S4-native/observations.json "$RUNNER_TEMP/phone-trial-3-observations.json"; fi
        if: always()
      - name: Explicit cross-channel fallback on its own fresh stack
        run: pnpm test -- --native-otp apps/api/test/otp-fallback-native.local.spec.ts
      - run: if [ -f docs/auth/evidence/followup/followup2/fallback-native-shape.json ]; then mv docs/auth/evidence/followup/followup2/fallback-native-shape.json "$RUNNER_TEMP/fallback-native-observations.json"; fi
        if: always()
      - name: CAPTCHA rejection on another fresh stack
        run: pnpm test -- --native-otp --captcha-reject --auth-contracts apps/api/test/supabase-sms-hook.local.spec.ts
      - run: if [ -f docs/auth/evidence/S4-native/observations.json ]; then mv docs/auth/evidence/S4-native/observations.json "$RUNNER_TEMP/captcha-native-observations.json"; fi
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-native-safe-observations
          path: |
            ${{ runner.temp }}/phone-native-observations.json
            ${{ runner.temp }}/phone-trial-*-observations.json
            ${{ runner.temp }}/fallback-native-observations.json
            ${{ runner.temp }}/captcha-native-observations.json

  container-build:
    name: Build Container Images
    needs: [verify, auth-disposable, db-security-gate, auth-native-otp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: indian-job-portal-api:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: indian-job-portal-worker:latest

  deploy-staging:
    name: Deploy to Staging
    needs: [verify, auth-disposable, db-security-gate, auth-native-otp, container-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment remains unimplemented
        run: |
          # TODO human-approved deploy
          exit 1

  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deployment remains unimplemented
        run: |
          # TODO human-approved deploy
          exit 1
