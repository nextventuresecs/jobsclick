name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RAILWAY_CLI_VERSION: '5.71.0'

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Check
        run: pnpm typecheck

      - name: Run Test Suite
        run: pnpm test

      - name: Build All Workspaces
        run: pnpm build

  container-build:
    name: Build Container Images
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, web]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release gate and source export
        if: matrix.service == 'api'
        run: node --test scripts/ci/railway-release.test.mjs
      - name: Export tracked source
        id: source
        run: node scripts/ci/export-release-source.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Verify Docker ignores local artifacts
        if: matrix.service == 'api'
        run: node --test scripts/ci/docker-context.test.mjs
      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.source.outputs.path }}
          file: ${{ steps.source.outputs.path }}/apps/${{ matrix.service }}/Dockerfile
          push: false

  deploy-staging:
    name: Deploy to Staging
    needs: [verify, container-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    outputs:
      healthy_sha: ${{ steps.health.outputs.healthy_sha }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export tracked source
        id: source
        run: node scripts/ci/export-release-source.mjs
      - name: Install Railway CLI
        run: npm install -g "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Deploy and verify Railway staging services
        id: health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          SOURCE_PATH: ${{ steps.source.outputs.path }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL || 'https://api-staging.jobsclick.live' }}
          STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://staging.jobsclick.live' }}
        shell: bash
        run: |
          node scripts/ci/railway-release.mjs staging "$SOURCE_PATH" "$GITHUB_SHA"
          printf 'healthy_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      needs.deploy-staging.result == 'success' && needs.deploy-staging.outputs.healthy_sha == github.sha
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export tracked source
        id: source
        run: node scripts/ci/export-release-source.mjs
      - name: Install Railway CLI
        run: npm install -g "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Deploy Services to Railway (Production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_TOKEN }}
          SOURCE_PATH: ${{ steps.source.outputs.path }}
        run: node scripts/ci/railway-release.mjs production "$SOURCE_PATH" "$GITHUB_SHA"
